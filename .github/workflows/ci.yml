name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint · typecheck · lifecycle · build · coordination · release-docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          # Match lockfile rebuild target; keep CI and local install in sync
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Lifecycle fixture
        run: npm run test:lifecycle

      - name: Graph seam tests (optional)
        run: |
          if npm run | grep -qE '^\s*test:graph'; then
            npm run test:graph
          else
            echo "test:graph not defined — skip (expected until Postgres seam lands)"
          fi

      - name: Build
        run: npm run build

      - name: Coordination verify
        env:
          # Enforce Work-Order reference on pull_request events
          REQUIRE_PR_WORK_ORDER: ${{ github.event_name == 'pull_request' && '1' || '0' }}
          PR_BODY: ${{ github.event.pull_request.body || '' }}
          GITHUB_BASE_REF: ${{ github.base_ref || 'main' }}
        run: npm run verify:coordination

      # Offline-only: release document/gate completeness (no deploy, DB, or secrets)
      - name: Release readiness (docs process)
        run: npm run verify:release-readiness

name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          # Match lockfile rebuild target; keep CI and local install in sync
          node-version: '24'
          cache: npm

      - name: Clean checkout preflight
        run: npm run verify:clean-worktree

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Lifecycle fixture
        run: npm run test:lifecycle

      - name: Graph seam tests
        run: npm run test:graph

      - name: Public assess fixtures
        run: npm run test:public-assess

      - name: Decision Brief contract fixtures
        run: npm run test:decision-brief-contracts

      - name: Product surface fixtures
        run: npm run test:product-surface

      - name: Operator build (no runtime tsx)
        run: npm run operator:build

      - name: Operator fixtures
        run: npm run test:operator

      - name: Operator release-candidate fixtures (WO-018)
        run: npm run test:operator-rc

      - name: Golden-path dogfood battery (WO-021)
        run: npm run test:golden-path

      - name: Build
        run: npm run build

      - name: Coordination verify
        env:
          # Work-Order required for human/agent PRs. Exempt only when the PR author
          # login is exactly dependabot[bot] (GitHub event identity — not branch/title/body).
          REQUIRE_PR_WORK_ORDER: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]' && '1' || '0' }}
          PR_BODY: ${{ github.event.pull_request.body || '' }}
          GITHUB_BASE_REF: ${{ github.base_ref || 'main' }}
        run: npm run verify:coordination

      # Offline-only: release document/gate completeness (no deploy, DB, or secrets)
      - name: Release readiness (docs process)
        run: npm run verify:release-readiness

      - name: Internal system graph
        run: npm run verify:system-graph

      # Catch generated tracked files and any non-ignored residue from verification.
      - name: Clean checkout after verification
        run: npm run verify:clean-worktree
